<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Residentado EsSalud Cusco</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --azul: #004C73;
    --azul-medio: #0077A8;
    --azul-oscuro: #00344F;
    --celeste: #3FA9DC;
    --celeste-oscuro: #1F8FC4;
    --verde: #2F9E68;
    --verde-fondo: #E7F5EE;
    --rojo: #D64545;
    --rojo-fondo: #FBEAEA;
    --gris: #5B6B76;
    --gris-claro: #EEF3F5;
    --fondo: #F3F6F8;
    --superficie: #FFFFFF;
    --texto: #1E2A32;
    --borde: #DCE6EA;
    --radio: 10px;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    font-family: 'Public Sans', -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: var(--fondo);
    color: var(--texto);
    -webkit-font-smoothing: antialiased;
  }
  h1, h2, h3, h4 { font-weight: 700; letter-spacing: -0.01em; }
  a { color: var(--azul-medio); }
  :focus-visible { outline: 3px solid var(--celeste); outline-offset: 2px; }

  header.topbar {
    background: var(--azul);
    background-image: linear-gradient(180deg, var(--azul) 0%, var(--azul-oscuro) 100%);
    color: white; padding: 14px 24px;
    display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 10px;
    border-bottom: 4px solid var(--celeste);
  }
  header.topbar .marca { display: flex; align-items: baseline; gap: 10px; }
  header.topbar .marca .es { font-weight: 800; font-size: 19px; }
  header.topbar .marca .es span { color: var(--celeste); }
  header.topbar .marca small { opacity: 0.85; font-weight: 400; font-size: 12.5px; }
  header.topbar .user-info { font-size: 13px; opacity: 0.95; display: flex; align-items: center; gap: 10px; }
  header.topbar .user-info .rol-chip { background: rgba(255,255,255,0.16); border: 1px solid rgba(255,255,255,0.3); padding: 3px 10px; border-radius: 100px; font-size: 12px; text-transform: capitalize; }
  header.topbar button.logout { background: transparent; border: 1px solid rgba(255,255,255,0.45); color: white; padding: 7px 14px; border-radius: 7px; cursor: pointer; font-size: 13px; font-family: inherit; }
  header.topbar button.logout:hover { background: rgba(255,255,255,0.14); }

  main { max-width: 1300px; margin: 0 auto; padding: 24px 18px 70px; }

  .login-wrap { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; background: radial-gradient(1200px 600px at 15% 10%, #E8F1F6 0%, var(--fondo) 55%); }
  .login-card { background: var(--superficie); border-radius: var(--radio); box-shadow: 0 18px 46px rgba(0, 51, 79, 0.14); width: 100%; max-width: 400px; overflow: hidden; border-top: 5px solid var(--celeste); }
  .login-card .login-inner { padding: 34px 30px 28px; }
  .login-card .login-eyebrow { font-size: 12.5px; color: var(--azul-medio); font-weight: 600; margin: 0 0 4px; }
  .login-card h2 { margin: 0 0 6px; color: var(--azul-oscuro); font-size: 21px; }
  .login-card p.subtitle { color: var(--gris); font-size: 13.5px; margin: 0 0 4px; line-height: 1.5; }
  label { display: block; font-size: 13px; font-weight: 600; margin: 16px 0 6px; color: var(--azul-oscuro); }
  input, select, textarea { width: 100%; padding: 11px 12px; border: 1.5px solid var(--borde); border-radius: 8px; font-size: 14.5px; background: white; font-family: inherit; color: var(--texto); }
  input:focus, select:focus, textarea:focus { border-color: var(--azul-medio); }
  select:disabled, input:disabled { background: var(--gris-claro); color: var(--gris); }
  button.primary { margin-top: 20px; width: 100%; background: var(--celeste); color: white; border: none; padding: 12px; border-radius: 8px; font-size: 14.5px; font-weight: 700; cursor: pointer; font-family: inherit; transition: background .12s; }
  button.primary:hover { background: var(--celeste-oscuro); }
  button.primary:disabled { background: #c9c9c9; cursor: default; }
  button.secondary { background: white; color: var(--azul); border: 1.5px solid var(--azul); padding: 9px 14px; border-radius: 8px; font-size: 13.5px; cursor: pointer; font-family: inherit; font-weight: 600; }
  button.secondary:hover { background: var(--gris-claro); }
  .error-msg { background: var(--rojo-fondo); color: var(--rojo); padding: 11px 13px; border-radius: 8px; font-size: 13.5px; margin-top: 12px; border: 1px solid rgba(214,69,69,0.25); }
  .success-msg { background: var(--verde-fondo); color: var(--verde); padding: 11px 13px; border-radius: 8px; font-size: 13.5px; margin-top: 12px; border: 1px solid rgba(47,158,104,0.25); }

  .pagina-titulo { color: var(--azul-oscuro); margin: 4px 0 22px; font-size: 22px; }
  .menu-lista { display: flex; flex-direction: column; gap: 10px; margin-top: 18px; }
  .menu-item { background: var(--superficie); border: 1px solid var(--borde); border-left: 4px solid var(--azul-medio); border-radius: 8px; padding: 18px 20px; cursor: pointer; display: flex; align-items: center; justify-content: space-between; gap: 14px; transition: border-color .12s, background .12s; }
  .menu-item:hover { background: #FAFCFD; border-left-color: var(--celeste); }
  .menu-item.desactivado { opacity: .55; cursor: default; }
  .menu-item.desactivado:hover { background: var(--superficie); border-left-color: var(--azul-medio); }
  .menu-item .texto h3 { margin: 0 0 3px; color: var(--azul-oscuro); font-size: 15.5px; }
  .menu-item .texto p { margin: 0; font-size: 13px; color: var(--gris); }
  .menu-item .flecha { color: var(--gris); font-size: 18px; }
  .badge { display: inline-block; padding: 2px 9px; border-radius: 100px; font-size: 11.5px; font-weight: 700; margin-left: 8px; }
  .badge.ok { background: var(--verde-fondo); color: var(--verde); }
  .badge.pend { background: var(--gris-claro); color: var(--gris); }

  .back-link { display: inline-flex; align-items: center; gap: 6px; margin-bottom: 16px; color: var(--azul-medio); cursor: pointer; font-size: 13.5px; font-weight: 600; }
  .back-link:hover { color: var(--azul); }

  h2.section-title { color: var(--azul-oscuro); margin: 0 0 4px; font-size: 20px; }
  p.section-sub { color: var(--gris); margin: 0 0 20px; font-size: 13.5px; }

  .layout-matricula { display: grid; grid-template-columns: minmax(0, 1fr) 320px; gap: 18px; align-items: start; }
  @media (max-width: 860px) { .layout-matricula { grid-template-columns: 1fr; } .panel-lateral { order: -1; } }

  .panel-lateral { background: var(--superficie); border-radius: var(--radio); border: 1px solid var(--borde); padding: 20px; position: sticky; top: 18px; }
  .panel-lateral h3 { margin: 0 0 4px; color: var(--azul-oscuro); font-size: 16px; }
  .panel-lateral .panel-sub { margin: 0 0 6px; font-size: 12.5px; color: var(--gris); line-height: 1.5; }
  .progreso-wrap { margin: 14px 0 6px; }
  .progreso-barra { height: 8px; background: var(--gris-claro); border-radius: 100px; overflow: hidden; }
  .progreso-relleno { height: 100%; background: var(--celeste); border-radius: 100px; transition: width .25s; }
  .progreso-texto { font-size: 12px; color: var(--gris); margin-top: 6px; }

  .panel-completo { text-align: center; padding: 18px 6px 4px; }
  .panel-completo .check-circulo { width: 52px; height: 52px; border-radius: 50%; background: var(--verde-fondo); color: var(--verde); display: flex; align-items: center; justify-content: center; font-size: 26px; margin: 0 auto 14px; }
  .panel-completo h3 { color: var(--azul-oscuro); margin: 0 0 8px; }
  .panel-completo p { color: var(--gris); font-size: 13.5px; line-height: 1.6; margin: 0; }

  .historial { background: var(--superficie); border: 1px solid var(--borde); border-radius: var(--radio); overflow: hidden; }
  .historial-fila { display: flex; justify-content: space-between; padding: 12px 16px; border-top: 1px solid var(--borde); font-size: 13.5px; }
  .historial-fila:first-child { border-top: none; }
  .historial-fila .mes { font-weight: 600; color: var(--azul-oscuro); }
  .historial-fila .detalle { color: var(--gris); text-align: right; }
  .historial-fila.vacio { color: var(--gris); font-style: italic; }
  .btn-eliminar-fila { background: none; border: none; color: var(--rojo); cursor: pointer; font-size: 13px; padding: 2px 4px; margin-left: 4px; border-radius: 4px; vertical-align: middle; }
  .btn-eliminar-fila:hover { background: var(--rojo-fondo); }

  .mes-bloque { background: var(--superficie); border: 1px solid var(--borde); border-radius: var(--radio); padding: 18px 20px; margin-bottom: 14px; }
  .mes-bloque h3 { margin-top: 0; color: var(--azul-oscuro); font-size: 15.5px; }
  .esp-fila { border-top: 1px solid var(--borde); padding: 11px 0; }
  .esp-fila:first-child { border-top: none; }
  .esp-fila .esp-nombre { font-weight: 600; color: var(--texto); }
  .esp-fila .esp-doctor { color: var(--gris); font-size: 12.5px; }
  .esp-fila .estudiantes { margin-top: 5px; font-size: 13px; }
  .chip { display: inline-block; background: var(--gris-claro); color: var(--azul-oscuro); padding: 3px 10px; border-radius: 100px; margin: 2px 4px 0 0; font-size: 12px; font-weight: 600; }

  .filtros { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 18px; align-items: center; }
  .filtros select, .filtros input { width: auto; min-width: 160px; }
  .filtros .mes-nav { display: flex; align-items: center; gap: 10px; font-weight: 700; color: var(--azul-oscuro); }
  .filtros .mes-nav button { background: var(--gris-claro); border: 1px solid var(--borde); border-radius: 8px; width: 34px; height: 34px; cursor: pointer; font-size: 15px; color: var(--azul); }
  .filtros .mes-nav button:hover { background: #E2ECF1; }

  .doc-list { display: grid; gap: 10px; }
  .doc-card { background: var(--superficie); border: 1px solid var(--borde); border-radius: var(--radio); padding: 14px 18px; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 10px; }
  .doc-card .titulo { font-weight: 600; color: var(--texto); }
  .doc-card .meta { font-size: 12.5px; color: var(--gris); }
  .doc-card a.link-btn { background: var(--azul); color: white; padding: 8px 16px; border-radius: 7px; text-decoration: none; font-size: 13px; font-weight: 600; }
  .doc-card a.link-btn:hover { background: var(--azul-oscuro); }

  .form-box { background: var(--superficie); border: 1px solid var(--borde); border-radius: var(--radio); padding: 20px; margin-bottom: 24px; max-width: 480px; }
  .form-box h3 { margin-top: 0; color: var(--azul-oscuro); }
  .loading { text-align: center; color: var(--gris); padding: 34px 10px; font-size: 13.5px; }
  .hidden { display: none !important; }
  .empty-state { text-align: center; color: var(--gris); padding: 30px; background: var(--superficie); border: 1px dashed var(--borde); border-radius: var(--radio); font-size: 13.5px; }

  .tabla-reporte { width: 100%; border-collapse: collapse; font-size: 12px; background: var(--superficie); border: 1px solid var(--borde); border-radius: var(--radio); overflow: hidden; }
  .tabla-reporte th, .tabla-reporte td { border: 1px solid var(--borde); padding: 6px 7px; text-align: center; white-space: nowrap; }
  .tabla-reporte th { background: var(--gris-claro); color: var(--azul-oscuro); position: sticky; top: 0; }
  .tabla-reporte th.prog-col, .tabla-reporte td.prog-col { position: sticky; left: 0; background: var(--gris-claro); text-align: left; font-weight: 600; }
  .tabla-reporte td.prog-col { background: var(--superficie); }
  .celda-cupo.lleno { background: var(--rojo-fondo); color: var(--rojo); font-weight: 700; }
  .celda-cupo.libre { background: var(--verde-fondo); color: var(--verde); }
  .tabla-wrap-reporte { overflow-x: auto; }

  .file-picker { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .file-picker input[type=file] { display: none; }
  .file-picker .file-btn { background: var(--gris-claro); color: var(--azul-oscuro); border: 1.5px dashed var(--azul-medio); padding: 10px 16px; border-radius: 8px; font-size: 13.5px; font-weight: 600; cursor: pointer; display: inline-flex; align-items: center; gap: 8px; transition: background .12s; }
  .file-picker .file-btn:hover { background: #E2ECF1; }
  .file-picker .file-nombre { font-size: 13px; color: var(--gris); }
  .file-picker .file-nombre.elegido { color: var(--verde); font-weight: 600; }

  .modal-overlay { position: fixed; inset: 0; background: rgba(0,52,79,0.45); display: flex; align-items: center; justify-content: center; padding: 20px; z-index: 1000; animation: modal-fade-in .15s ease-out; }
  @keyframes modal-fade-in { from { opacity: 0; } to { opacity: 1; } }
  .modal-caja { background: var(--superficie); border-radius: var(--radio); max-width: 400px; width: 100%; padding: 24px; box-shadow: 0 20px 50px rgba(0,52,79,0.3); border-top: 4px solid var(--celeste); animation: modal-pop .15s ease-out; }
  @keyframes modal-pop { from { transform: translateY(8px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
  .modal-caja h3 { margin: 0 0 10px; color: var(--azul-oscuro); font-size: 16.5px; }
  .modal-caja p { margin: 0; color: var(--texto); font-size: 14px; line-height: 1.6; white-space: pre-line; }
  .modal-botones { display: flex; gap: 10px; margin-top: 20px; }
  .modal-botones button { flex: 1; margin-top: 0; }

  .toast-wrap { position: fixed; top: 20px; left: 50%; transform: translateX(-50%); z-index: 1100; display: flex; flex-direction: column; gap: 8px; align-items: center; }
  .toast { padding: 12px 20px; border-radius: 8px; font-size: 13.5px; font-weight: 600; box-shadow: 0 10px 28px rgba(0,52,79,0.18); animation: toast-in .18s ease-out; max-width: 90vw; }
  @keyframes toast-in { from { transform: translateY(-12px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
  .toast.exito { background: var(--verde-fondo); color: var(--verde); border: 1px solid rgba(47,158,104,0.3); }
  .toast.falla { background: var(--rojo-fondo); color: var(--rojo); border: 1px solid rgba(214,69,69,0.3); }
</style>
</head>
<body>

<div id="app"></div>

<script>
/*************** CONFIGURACIÓN — CAMBIAR ANTES DE PUBLICAR ***************/
var CONFIG = {
  API_URL: 'https://script.google.com/macros/s/AKfycbwjHax-dtvCnDHDK0eKAwDay60sq2D40spfribYMrbNQR_HFY4wN4WUTVg1G2ISGnc4/exec'
};
/***************************************************************************/

var state = {
  usuario: JSON.parse(localStorage.getItem('residentado_usuario') || 'null'),
  vista: 'menu',
  residenteSeleccionado: null // dni del residente que el doctor está matriculando
};

var app = document.getElementById('app');

function apiGet(action, params) {
  var qs = new URLSearchParams(Object.assign({ action: action }, params || {})).toString();
  return fetch(CONFIG.API_URL + '?' + qs).then(function (r) { return r.json(); });
}
function apiPost(action, payload) {
  return fetch(CONFIG.API_URL, {
    method: 'POST',
    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
    body: JSON.stringify(Object.assign({ action: action }, payload || {}))
  }).then(function (r) { return r.json(); });
}

function setVista(v) { state.vista = v; render(); }
function logout() { localStorage.removeItem('residentado_usuario'); state.usuario = null; setVista('menu'); }
function rolNormalizado() { return state.usuario ? String(state.usuario.rol || '').toLowerCase().trim() : ''; }

function render() {
  if (!state.usuario) { renderLogin(); return; }
  var v = state.vista;
  if (v === 'menu') renderMenu();
  else if (v === 'matricular') renderMatricular();
  else if (v === 'residentes-por-programa') renderResidentesPorPrograma();
  else if (v === 'reporte-cupos') renderReporteCupos();
  else if (v === 'documentos') renderDocumentos();
  else renderMenu();
}

function shell(contentHtml) {
  var rol = rolNormalizado();
  var rolLabel = rol === 'area_archivos' ? 'Área de archivos' : (rol === 'estudiante' ? 'Residente' : (rol === 'doctor' ? 'Doctor' : (state.usuario ? state.usuario.rol : '')));
  app.innerHTML =
    '<header class="topbar">' +
      '<div class="marca"><span class="es">Es<span>Salud</span> Cusco</span><small>Residentado médico</small></div>' +
      (state.usuario ? ('<div class="user-info">' + escapeHtml(state.usuario.nombre) + '<span class="rol-chip">' + escapeHtml(rolLabel) + '</span><button class="logout" onclick="logout()">Salir</button></div>') : '') +
    '</header>' +
    '<main>' + contentHtml + '</main>';
}

function escapeHtml(s) {
  return String(s || '').replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; });
}

function mostrarConfirmacion(titulo, mensaje) {
  return new Promise(function (resolve) {
    var overlay = document.createElement('div');
    overlay.className = 'modal-overlay';
    overlay.innerHTML = '<div class="modal-caja"><h3>' + escapeHtml(titulo) + '</h3><p>' + escapeHtml(mensaje) + '</p>' +
      '<div class="modal-botones"><button class="secondary" id="modal-cancelar">Cancelar</button><button class="primary" id="modal-confirmar" style="margin-top:0">Confirmar</button></div></div>';
    document.body.appendChild(overlay);
    function cerrar(r) { document.body.removeChild(overlay); resolve(r); }
    overlay.querySelector('#modal-confirmar').onclick = function () { cerrar(true); };
    overlay.querySelector('#modal-cancelar').onclick = function () { cerrar(false); };
    overlay.onclick = function (e) { if (e.target === overlay) cerrar(false); };
  });
}
function mostrarToast(mensaje, tipo) {
  var wrap = document.getElementById('toast-wrap');
  if (!wrap) { wrap = document.createElement('div'); wrap.id = 'toast-wrap'; wrap.className = 'toast-wrap'; document.body.appendChild(wrap); }
  var toast = document.createElement('div');
  toast.className = 'toast ' + (tipo === 'error' ? 'falla' : 'exito');
  toast.textContent = mensaje;
  wrap.appendChild(toast);
  setTimeout(function () { toast.remove(); }, 3600);
}
function crearSelectorArchivo(id) {
  return '<div class="file-picker"><input type="file" id="' + id + '" accept="application/pdf" />' +
    '<label class="file-btn" for="' + id + '">📎 Elegir archivo PDF</label>' +
    '<span class="file-nombre" id="' + id + '-nombre">Ningún archivo seleccionado</span></div>';
}
function activarSelectorArchivo(id) {
  var input = document.getElementById(id);
  var nombre = document.getElementById(id + '-nombre');
  input.addEventListener('change', function () {
    if (input.files.length) { nombre.textContent = input.files[0].name; nombre.className = 'file-nombre elegido'; }
    else { nombre.textContent = 'Ningún archivo seleccionado'; nombre.className = 'file-nombre'; }
  });
}

// ==================================================================
// LOGIN
// ==================================================================
function renderLogin() {
  app.innerHTML =
    '<div class="login-wrap"><div class="login-card"><div class="login-inner">' +
      '<p class="login-eyebrow">EsSalud Cusco</p><h2>Residentado médico</h2>' +
      '<p class="subtitle">Ingresa con tu DNI y la contraseña entregada en la oficina de la sede.</p>' +
      '<div id="login-error"></div><label>DNI</label>' +
      '<input id="in-dni" inputmode="numeric" maxlength="15" placeholder="Ej. 70123456" />' +
      '<label>Contraseña</label><input id="in-pass" type="password" placeholder="Contraseña" />' +
      '<button class="primary" id="btn-login">Ingresar</button>' +
    '</div></div></div>';

  document.getElementById('btn-login').onclick = function () {
    var dni = document.getElementById('in-dni').value.trim();
    var pass = document.getElementById('in-pass').value.trim();
    var errBox = document.getElementById('login-error');
    errBox.innerHTML = '';
    if (!dni || !pass) { errBox.innerHTML = '<div class="error-msg">Ingresa tu DNI y tu contraseña.</div>'; return; }
    var btn = document.getElementById('btn-login');
    btn.disabled = true; btn.textContent = 'Ingresando...';
    apiPost('login', { dni: dni, password: pass }).then(function (res) {
      btn.disabled = false; btn.textContent = 'Ingresar';
      if (res.ok) { state.usuario = res; localStorage.setItem('residentado_usuario', JSON.stringify(res)); setVista('menu'); }
      else errBox.innerHTML = '<div class="error-msg">' + escapeHtml(res.error || 'No se pudo iniciar sesión.') + '</div>';
    }).catch(function (err) {
      btn.disabled = false; btn.textContent = 'Ingresar';
      errBox.innerHTML = '<div class="error-msg">Error de conexión: ' + escapeHtml(err.message || err) + '</div>';
    });
  };
}

// ==================================================================
// MENÚ PRINCIPAL
// ==================================================================
function renderMenu() {
  var rol = rolNormalizado();
  var items = [];

  if (rol === 'area_archivos') items.push({ vista: 'matricular', titulo: 'Matricular residentes', desc: 'Arma el horario de cualquier residente, mes a mes.' });
  if (rol === 'area_archivos') items.push({ vista: 'documentos', titulo: 'Registrar archivos', desc: 'Sube documentos PDF públicos del residentado.' });
  items.push({ vista: 'residentes-por-programa', titulo: 'Residentes por Programa', desc: 'Elige un programa y consulta quiénes están asignados, este mes.' });
  if (rol === 'doctor' || rol === 'area_archivos') items.push({ vista: 'reporte-cupos', titulo: 'Ver cupos', desc: 'Cupos internos y externos, ocupados y libres, próximos 12 meses.' });
  if (rol === 'estudiante' || rol === 'doctor') items.push({ vista: 'documentos', titulo: 'Documentos', desc: 'Revisa los documentos publicados por el área correspondiente.' });

  var html = '<h2 class="pagina-titulo">¿Qué deseas hacer hoy?</h2><div class="menu-lista">';
  items.forEach(function (it) {

function backLink(destino) {

// ==================================================================
// MATRICULAR (rol area_archivos): elegir cualquier residente -> armar su horario
// ==================================================================
function renderMatricular() {
  if (!state.residenteSeleccionado) { renderListaResidentes(); return; }
  renderHorarioResidente();
}

function renderListaResidentes() {
  shell(backLink() + '<h2 class="section-title">Matricular residentes</h2><p class="section-sub">Busca un residente y arma o continúa su horario.</p>' +
        '<div class="filtros"><input id="buscar-residente" placeholder="Buscar por nombre, DNI o programa…" style="min-width:280px" /></div>' +
        '<div id="mat-contenido" class="loading">Cargando…</div>');

  apiGet('getTodosLosResidentes', {}).then(function (res) {
    var cont = document.getElementById('mat-contenido');
    if (!res.ok) { cont.innerHTML = '<div class="error-msg">' + escapeHtml(res.error || 'Error al cargar.') + '</div>'; return; }
    if (!res.residentes.length) { cont.innerHTML = '<div class="empty-state">No hay residentes registrados todavía.</div>'; return; }

    function pintar(lista) {
      if (!lista.length) { cont.innerHTML = '<div class="empty-state">Ningún residente coincide con la búsqueda.</div>'; return; }
      cont.innerHTML = '<div class="menu-lista">' + lista.map(function (r) {
        var badgeAnio = r.anioResidencia === 0
          ? '<span class="badge pend">' + escapeHtml(r.estadoTexto) + '</span>'
          : '<span class="badge ' + (r.completo ? 'ok' : 'pend') + '">Año ' + r.anioResidencia + ' — ' + r.registrados + '/' + r.total + '</span>';
        var badgeOrigen = r.origen === 'Externo' ? '<span class="badge pend" style="background:#FBEAEA;color:var(--rojo)">Externo</span>' : '';
        var desactivado = r.anioResidencia === 0 ? ' desactivado' : '';
        return '<div class="menu-item' + desactivado + '" data-dni="' + r.dni + '" data-disponible="' + (r.anioResidencia !== 0) + '">' +
          '<div class="texto"><h3>' + escapeHtml(r.nombre) + badgeAnio + badgeOrigen + '</h3><p>DNI ' + escapeHtml(r.dni) + ' · ' + escapeHtml(r.programaNombre) + '</p></div>' +
          '<div class="flecha">&rsaquo;</div></div>';
      }).join('') + '</div>';
      document.querySelectorAll('.menu-item[data-dni]').forEach(function (el) {
        if (el.getAttribute('data-disponible') !== 'true') return;
        el.onclick = function () { state.residenteSeleccionado = el.getAttribute('data-dni'); renderMatricular(); };
      });
    }

    pintar(res.residentes);
    document.getElementById('buscar-residente').oninput = function (e) {
      var q = e.target.value.trim().toLowerCase();
      if (!q) { pintar(res.residentes); return; }
      pintar(res.residentes.filter(function (r) {
        return r.nombre.toLowerCase().indexOf(q) !== -1 || r.dni.indexOf(q) !== -1 || r.programaNombre.toLowerCase().indexOf(q) !== -1 || r.origen.toLowerCase().indexOf(q) !== -1;
      }));
    };
  }).catch(function (err) {
    document.getElementById('mat-contenido').innerHTML = '<div class="error-msg">Error de conexión: ' + escapeHtml(err.message || err) + '</div>';
  });
}

function renderHorarioResidente() {
  shell(backLink() + '<h2 class="section-title">Horario de matrícula</h2><div id="hor-contenido" class="loading">Cargando…</div>');
  cargarHorarioResidente();
}

function cargarHorarioResidente() {
  apiGet('getHorarioResidente', { dniResidente: state.residenteSeleccionado, dniRegistrador: state.usuario.dni }).then(function (res) {
    var cont = document.getElementById('hor-contenido');
    if (!res.ok) {
      cont.innerHTML = '<div class="error-msg">' + escapeHtml(res.error || 'Error al cargar.') + '</div>' +
        '<button class="secondary" style="margin-top:14px" onclick="state.residenteSeleccionado=null;renderMatricular();">&larr; Elegir otro residente</button>';
      return;
    }

    var historialHtml = '<div class="historial">';
    var huboAlguno = false;
    res.meses.forEach(function (m) {
      var reg = res.misAsignaciones[m.key];
      if (reg) {
        huboAlguno = true;
        var etiquetaTipo = reg.tipo === 'Externo' ? ' (externo)' : '';
        historialHtml += '<div class="historial-fila"><span class="mes">' + escapeHtml(m.label) + '</span>' +
          '<span class="detalle">' + escapeHtml(reg.rotacion) + escapeHtml(etiquetaTipo) +
          ' <button class="btn-eliminar-fila" data-mes="' + m.key + '" title="Eliminar este registro">🗑</button></span></div>';
      }
    });
    if (!huboAlguno) historialHtml += '<div class="historial-fila vacio">Aún no hay meses registrados en este año.</div>';
    historialHtml += '</div>';

    var panelHtml;
    if (!res.mesActivo) {
      panelHtml = '<div class="panel-completo"><div class="check-circulo">&#10003;</div><h3>Año completo</h3>' +
        '<p>Ya registraste los 12 meses del Año ' + res.anioResidencia + ' de ' + escapeHtml(res.residente.nombre) + '.</p></div>' +
        '<button class="primary" id="btn-otro-residente" style="margin-top:16px">Añadir / continuar otro residente</button>';
    } else {
      var pct = Math.round((res.progreso.registrados / res.progreso.total) * 100);
      var esExternoRes = res.residente.origen === 'Externo';
      panelHtml = '<h3>' + escapeHtml(res.residente.nombre) + (esExternoRes ? ' <span class="badge pend" style="background:#FBEAEA;color:var(--rojo)">Externo</span>' : '') + '</h3>' +
        '<p class="panel-sub">Año ' + res.anioResidencia + ' — Mes actual: <strong>' + escapeHtml(res.mesActivo.label) + '</strong>' +
        (esExternoRes ? ' — compite por el cupo EXTERNO de cada programa, no el interno.' : '') + '</p>' +
        '<div class="progreso-wrap"><div class="progreso-barra"><div class="progreso-relleno" style="width:' + pct + '%"></div></div>' +
        '<div class="progreso-texto">' + res.progreso.registrados + ' de ' + res.progreso.total + ' meses registrados</div></div>' +
        '<div id="matricula-msg"></div><label>Rotación</label>' +
        '<select id="sel-rotacion"><option value="" selected disabled>Elige una opción…</option>' + res.opciones.map(function (o) {
          var etiqueta;
          if (o.tipo === 'Vacaciones') etiqueta = o.nombre;
          else if (o.tipo === 'Externo') etiqueta = o.nombre + ' (Externo' + (o.institucionExterna ? ' — ' + o.institucionExterna : '') + ')';
          else if (o.sinCupoExterno) etiqueta = o.nombre + ' — ' + o.programaNombre + ' (sin cupo externo configurado)';
          else etiqueta = o.nombre + ' — ' + o.programaNombre + (o.lleno ? ' (SIN CUPO — ' + o.ocupados + '/' + o.cupoMaximo + ')' : ' (' + o.ocupados + '/' + o.cupoMaximo + ' cupos)');
          return '<option value="' + escapeHtml(o.nombre) + '"' + (o.lleno ? ' disabled' : '') + '>' + escapeHtml(etiqueta) + '</option>';
        }).join('') + '</select>' +
        '<button class="primary" id="btn-matricular">Registrar mes</button>' +
        '<button class="secondary" id="btn-otro-residente" style="width:100%;margin-top:10px">Elegir otro residente</button>';
    }

    cont.innerHTML = '<div class="layout-matricula">' +
      '<div><h3 style="color:var(--azul-oscuro);font-size:15px;margin:0 0 10px">Historial — ' + escapeHtml(res.residente.nombre) + ' (Año ' + res.anioResidencia + ')</h3>' + historialHtml + '</div>' +
      '<div class="panel-lateral">' + panelHtml + '</div></div>';

    var btnOtro = document.getElementById('btn-otro-residente');
    if (btnOtro) btnOtro.onclick = function () { state.residenteSeleccionado = null; renderMatricular(); };

    document.querySelectorAll('.btn-eliminar-fila').forEach(function (btnEl) {
      btnEl.onclick = function () {
        var mesKey = btnEl.getAttribute('data-mes');
        var mesLabel = (res.meses.filter(function (m) { return m.key === mesKey; })[0] || {}).label || mesKey;
        mostrarConfirmacion('Eliminar registro', '¿Eliminar la rotación registrada en ' + mesLabel + ' de ' + res.residente.nombre + '? Esto libera el cupo y el mes queda otra vez disponible para matricular.').then(function (ok) {
          if (!ok) return;
          apiPost('eliminarAsignacion', { dniRegistrador: state.usuario.dni, dniResidente: state.residenteSeleccionado, anioResidencia: res.anioResidencia, mes: mesKey }).then(function (r) {
            if (r.ok) { mostrarToast(r.mensaje, 'exito'); cargarHorarioResidente(); }
            else mostrarToast(r.error, 'error');
          }).catch(function (err) { mostrarToast('Error de conexión: ' + (err.message || err), 'error'); });
        });
      };
    });

    var btn = document.getElementById('btn-matricular');
    if (!btn) return;
    btn.onclick = function () {
      var sel = document.getElementById('sel-rotacion');
      var msgBox = document.getElementById('matricula-msg');
      if (!sel.value) { msgBox.innerHTML = '<div class="error-msg">Elige una opción.</div>'; return; }
      mostrarConfirmacion('Confirmar rotación', '¿Confirmas "' + sel.value + '" para ' + res.residente.nombre + ' en ' + res.mesActivo.label + '?\n\nSi te equivocas, lo puedes borrar después con el botón 🗑 del historial.').then(function (ok) {
        if (!ok) return;
        btn.disabled = true; btn.textContent = 'Registrando...'; sel.disabled = true;
        apiPost('registrarRotacion', { dniRegistrador: state.usuario.dni, dniResidente: state.residenteSeleccionado, rotacion: sel.value }).then(function (r) {
          if (r.ok) { mostrarToast(r.mensaje, 'exito'); cargarHorarioResidente(); }
          else {
            btn.disabled = false; btn.textContent = 'Registrar mes'; sel.disabled = false;
            msgBox.innerHTML = '<div class="error-msg">' + escapeHtml(r.error) + '</div>';
            mostrarToast(r.error, 'error');
            cargarHorarioResidente();
          }
        }).catch(function (err) {
          btn.disabled = false; btn.textContent = 'Registrar mes'; sel.disabled = false;
          msgBox.innerHTML = '<div class="error-msg">Error de conexión: ' + escapeHtml(err.message || err) + '</div>';
        });
      });
    };
  }).catch(function (err) {
    document.getElementById('hor-contenido').innerHTML = '<div class="error-msg">Error de conexión: ' + escapeHtml(err.message || err) + '</div>';
  });
}

// ==================================================================
// RESIDENTES POR PROGRAMA (mes actual real, con flecha de mes siguiente
// para prevenir el cambio, y filtro por año de residencia)
// ==================================================================
function mesConDelta(key, delta) {
  var y = parseInt(key.substring(0, 4), 10);
  var m = parseInt(key.substring(5, 7), 10) - 1;
  var total = y * 12 + m + delta;
  var ny = Math.floor(total / 12);
  var nm = ((total % 12) + 12) % 12;
  return ny + '-' + ('0' + (nm + 1)).slice(-2);
}

function renderResidentesPorPrograma() {
  var mesSeleccionado = ''; // vacío = mes real actual (el servidor decide)

  shell(backLink() + '<h2 class="section-title">Residentes por Programa</h2>' +
        '<p class="section-sub" id="rpp-sub">Elige un programa para ver quiénes están asignados.</p>' +

          '<select id="sel-anio-rpp"><option value="">Todos los años</option><option value="1">Año 1</option><option value="2">Año 2</option><option value="3">Año 3</option></select>' +
          '<div class="mes-nav"><button id="btn-mes-atras" title="Mes anterior">&lsaquo;</button><span id="mes-nav-label">…</span><button id="btn-mes-adelante" title="Mes siguiente">&rsaquo;</button></div>' +
        '</div>' +
        '<div id="rpp-contenido" class="loading">Cargando…</div>');

  function cargar() {
    document.getElementById('rpp-contenido').innerHTML = '<div class="loading">Cargando…</div>';
    apiGet('getResidentesPorPrograma', { anio: document.getElementById('sel-anio-rpp').value, mes: mesSeleccionado }).then(function (res) {
      var cont = document.getElementById('rpp-contenido');
      if (!res.ok) { cont.innerHTML = '<div class="error-msg">' + escapeHtml(res.error || 'Error al cargar.') + '</div>'; return; }

      mesSeleccionado = res.mesActual.key; // fija el mes que devolvió el servidor, para poder navegar desde ahí
      document.getElementById('mes-nav-label').textContent = res.mesActual.label;
      document.getElementById('rpp-sub').textContent = 'Elige un programa para ver quiénes están asignados en ' + res.mesActual.label + '.';

      function pintarOcupantes(programa) {
        if (!programa.ocupantes.length) return '<div class="empty-state">Sin residentes asignados en ' + escapeHtml(res.mesActual.label) + ' para este programa.</div>';
        return '<div class="esp-fila"><div class="esp-doctor">Doctor responsable: ' + escapeHtml(programa.doctorNombre || '—') + ' · Cupo ' + programa.ocupantes.length + '/' + programa.cupoMaximo + '</div>' +
          '<div class="estudiantes">' + programa.ocupantes.map(function (e) {
            return '<span class="chip">' + escapeHtml(e.nombre) + ' · ' + escapeHtml(e.rotacion) + (e.anioResidencia ? ' · Año ' + escapeHtml(e.anioResidencia) : '') + '</span>';
          }).join('') + '</div></div>';
      }

      cont.innerHTML = '<div class="menu-lista" id="rpp-lista">' + res.programas.map(function (p) {
        return '<div class="menu-item" data-programa="' + escapeHtml(p.codigo) + '"><div class="texto"><h3>' + escapeHtml(p.nombre) + '</h3><p>' + p.ocupantes.length + '/' + p.cupoMaximo + ' cupos ocupados este mes</p></div><div class="flecha">&rsaquo;</div></div>';
      }).join('') + '</div><div id="rpp-detalle"></div>';

      document.querySelectorAll('#rpp-lista .menu-item').forEach(function (el) {
        el.onclick = function () {
          var programa = res.programas.filter(function (p) { return p.codigo === el.getAttribute('data-programa'); })[0];
          document.getElementById('rpp-detalle').innerHTML = '<div class="mes-bloque"><h3>' + escapeHtml(programa.nombre) + ' — ' + escapeHtml(res.mesActual.label) + '</h3>' + pintarOcupantes(programa) + '</div>';
          document.getElementById('rpp-detalle').scrollIntoView({ behavior: 'smooth', block: 'nearest' });
        };
      });
    }).catch(function (err) {
      document.getElementById('rpp-contenido').innerHTML = '<div class="error-msg">Error de conexión: ' + escapeHtml(err.message || err) + '</div>';
    });
  }

  document.getElementById('sel-anio-rpp').onchange = cargar;
  document.getElementById('btn-mes-atras').onclick = function () { mesSeleccionado = mesConDelta(mesSeleccionado || mesSeleccionado, -1); cargar(); };
  document.getElementById('btn-mes-adelante').onclick = function () { mesSeleccionado = mesConDelta(mesSeleccionado, 1); cargar(); };
  cargar();
}

// ==================================================================
// DOCUMENTOS (carpeta "Archivos Públicos")
// ==================================================================
function renderDocumentos() {
  var esArea = rolNormalizado() === 'area_archivos';

  var formHtml = '';
  if (esArea) {
    formHtml =
      '<div class="form-box"><h3>Subir documento (PDF)</h3><div id="doc-form-msg"></div>' +
        '<label>Programa (opcional)</label><input id="doc-programa" placeholder="Ej. NEF" />' +
        '<label>Mes (opcional, formato AAAA-MM)</label><input id="doc-mes" placeholder="Ej. 2026-10" />' +
        '<label>Título / descripción</label><input id="doc-titulo" placeholder="Ej. Comunicado general" />' +
        '<label>Fecha de emisión</label><input id="doc-fecha" type="date" />' +
        '<label>Archivo PDF</label>' + crearSelectorArchivo('doc-archivo') +
        '<button class="primary" id="btn-subir-doc">Subir documento</button></div>';
  }

  shell(backLink() + '<h2 class="section-title">Documentos</h2><p class="section-sub">Repositorio público de archivos PDF del residentado.</p>' + formHtml +
        '<div class="filtros"><input id="f-programa" placeholder="Filtrar por programa" /><input id="f-mes" placeholder="Filtrar por mes (AAAA-MM)" /><button class="secondary" id="btn-filtrar">Filtrar</button></div>' +
        '<div id="doc-lista" class="loading">Cargando documentos…</div>');
  if (esArea) activarSelectorArchivo('doc-archivo');

  function cargarDocs() {
    var params = {};
    var programa = document.getElementById('f-programa').value.trim();
    var mes = document.getElementById('f-mes').value.trim();
    if (programa) params.programa = programa;
    if (mes) params.mes = mes;

    document.getElementById('doc-lista').innerHTML = '<div class="loading">Cargando documentos…</div>';
    apiGet('getDocumentos', params).then(function (res) {
      var cont = document.getElementById('doc-lista');
      if (!res.ok) { cont.innerHTML = '<div class="error-msg">' + escapeHtml(res.error || 'Error al cargar.') + '</div>'; return; }
      if (!res.documentos.length) { cont.innerHTML = '<div class="empty-state">No hay documentos que coincidan con el filtro.</div>'; return; }
      cont.innerHTML = '<div class="doc-list">' + res.documentos.map(function (d) {
        return '<div class="doc-card"><div><div class="titulo">' + escapeHtml(d.titulo) + '</div>' +
          '<div class="meta">' + [d.programa, d.mes, 'Emitido: ' + d.fechaEmision].filter(Boolean).join(' · ') + '</div></div>' +
          '<a class="link-btn" href="' + d.link + '" target="_blank" rel="noopener">Ver PDF</a></div>';
      }).join('') + '</div>';
    }).catch(function (err) {
      document.getElementById('doc-lista').innerHTML = '<div class="error-msg">Error de conexión: ' + escapeHtml(err.message || err) + '</div>';
    });
  }

  document.getElementById('btn-filtrar').onclick = cargarDocs;
  cargarDocs();

  if (esArea) {
    document.getElementById('btn-subir-doc').onclick = function () {
      var programa = document.getElementById('doc-programa').value.trim();
      var mes = document.getElementById('doc-mes').value.trim();
      var titulo = document.getElementById('doc-titulo').value.trim();
      var fecha = document.getElementById('doc-fecha').value;
      var archivoInput = document.getElementById('doc-archivo');
      var msgBox = document.getElementById('doc-form-msg');
      msgBox.innerHTML = '';

      if (!titulo || !fecha || !archivoInput.files.length) { msgBox.innerHTML = '<div class="error-msg">Completa título, fecha de emisión y selecciona un PDF.</div>'; return; }
      var file = archivoInput.files[0];
      if (file.type !== 'application/pdf') { msgBox.innerHTML = '<div class="error-msg">Solo se permiten archivos PDF.</div>'; return; }

      var reader = new FileReader();
      reader.onload = function () {
        var base64 = reader.result.split(',')[1];
        var btn = document.getElementById('btn-subir-doc');
        btn.disabled = true; btn.textContent = 'Subiendo...';
        apiPost('subirDocumento', { programa: programa, mes: mes, titulo: titulo, fechaEmision: fecha, dniArea: state.usuario.dni, fileBase64: base64, fileName: file.name, mimeType: file.type }).then(function (res) {
          btn.disabled = false; btn.textContent = 'Subir documento';
          if (res.ok) {
            mostrarToast('Documento subido correctamente.', 'exito'); archivoInput.value = '';
            document.getElementById(archivoInput.id + '-nombre').textContent = 'Ningún archivo seleccionado';
            document.getElementById(archivoInput.id + '-nombre').className = 'file-nombre';
            cargarDocs();
          } else msgBox.innerHTML = '<div class="error-msg">' + escapeHtml(res.error || 'No se pudo subir el documento.') + '</div>';
        }).catch(function (err) {
          btn.disabled = false; btn.textContent = 'Subir documento';
          msgBox.innerHTML = '<div class="error-msg">Error de conexión: ' + escapeHtml(err.message || err) + '</div>';
        });
      };
      reader.readAsDataURL(file);
    };
  }
}

render();
</script>
</body>
</html>
